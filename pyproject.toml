[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "gitpython>=3.1",
    "rich>=13.0",
]

[project.scripts]
gitool = "gitool.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitool*"]